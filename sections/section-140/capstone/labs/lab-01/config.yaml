# Protect An Orders API Behind A Gateway
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-090-capstone-140"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the tester pod and the lab's workloads, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-090-capstone-140-setup"
      description: "Creates the realm inventory with a gateway client that has a wildcard redirect, a long token lifetime, a misspelled audience and a misnamed groups claim"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-audience"
      description: "Confirms the access token is meant for orders-api"
      type: "file"
      source: "validation/validate-audience.sh"
    - name: "validate-groups"
      description: "Confirms the groups claim contains staff"
      type: "file"
      source: "validation/validate-groups.sh"
    - name: "validate-lifetime"
      description: "Confirms the access token lives 300 seconds or less"
      type: "file"
      source: "validation/validate-lifetime.sh"
    - name: "validate-redirect-exact"
      description: "Confirms the only redirect address is the exact callback"
      type: "file"
      source: "validation/validate-redirect-exact.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
