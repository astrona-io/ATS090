# Add Group And Tenant Claims To A Client
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-090-lab-080-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the tester pod and the lab's workloads, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-090-lab-080-01-setup"
      description: "Creates the realm inventory with a client that has no protocol mappers for groups or tenant"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-groups-claim"
      description: "Confirms the access token has a groups claim with logistics"
      type: "file"
      source: "validation/validate-groups-claim.sh"
    - name: "validate-tenant-claim"
      description: "Confirms the access token has the claim tenant with the value outpost"
      type: "file"
      source: "validation/validate-tenant-claim.sh"
    - name: "validate-tenant-not-in-id-token"
      description: "Confirms the ID token does not carry the tenant claim"
      type: "file"
      source: "validation/validate-tenant-not-in-id-token.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
