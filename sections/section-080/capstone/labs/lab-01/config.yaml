# Repair The Token Contents Of A Client
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-090-capstone-080"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the tester pod and the lab's workloads, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-090-capstone-080-setup"
      description: "Creates the realm inventory with a groups mapper that skips the access token, full scope on, and a default-worthy scope assigned as optional"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-groups-in-access-token"
      description: "Confirms the access token has a groups claim with logistics"
      type: "file"
      source: "validation/validate-groups-in-access-token.sh"
    - name: "validate-roles-in-access-token"
      description: "Confirms the access token holds inventory-reader and not inventory-admin"
      type: "file"
      source: "validation/validate-roles-in-access-token.sh"
    - name: "validate-audit-claim-by-default"
      description: "Confirms the audit claim appears without a scope parameter"
      type: "file"
      source: "validation/validate-audit-claim-by-default.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
