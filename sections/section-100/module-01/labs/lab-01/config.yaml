# Grant Access With A Role Policy
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-090-lab-100-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the tester pod and the lab's workloads, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-090-lab-100-01-setup"
      description: "Creates the resource server invoice-api with a permission whose role policy requires a role nobody has"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-finance-allowed"
      description: "Confirms alice may view an invoice"
      type: "file"
      source: "validation/validate-finance-allowed.sh"
    - name: "validate-no-role-denied"
      description: "Confirms bob may not view an invoice"
      type: "file"
      source: "validation/validate-no-role-denied.sh"
    - name: "validate-edit-denied"
      description: "Confirms nobody may edit an invoice"
      type: "file"
      source: "validation/validate-edit-denied.sh"
    - name: "validate-enforcing"
      description: "Confirms the resource server is still in enforcing mode"
      type: "file"
      source: "validation/validate-enforcing.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
