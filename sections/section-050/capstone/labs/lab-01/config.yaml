# Secure The Service Clients Of A Realm
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-090-capstone-050"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the tester pod and the lab's workloads, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-090-capstone-050-setup"
      description: "Creates the realm inventory with a service client that cannot authenticate, a leaked secret and a public client that should be a service client"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-reporter-secret-rotated"
      description: "Confirms inventory-reporter works with a new secret and the leaked secret is refused"
      type: "file"
      source: "validation/validate-reporter-secret-rotated.sh"
    - name: "validate-sync-service-client"
      description: "Confirms inventory-sync is a confidential service client that gets a token with inventory-reader"
      type: "file"
      source: "validation/validate-sync-service-client.sh"
    - name: "validate-reporter-role"
      description: "Confirms the token of inventory-reporter has inventory-reader"
      type: "file"
      source: "validation/validate-reporter-role.sh"
    - name: "validate-no-admin-role"
      description: "Confirms no service client token carries inventory-admin"
      type: "file"
      source: "validation/validate-no-admin-role.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
