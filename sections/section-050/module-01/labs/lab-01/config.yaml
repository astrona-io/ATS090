# Repair A Service Client
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-090-lab-050-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the tester pod and the lab's workloads, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-090-lab-050-01-setup"
      description: "Creates the realm inventory with inventory-reporter, a service client with service accounts turned off and no role"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-client-settings"
      description: "Confirms inventory-reporter is still a confidential client with service accounts on"
      type: "file"
      source: "validation/validate-client-settings.sh"
    - name: "validate-token-issued"
      description: "Confirms inventory-reporter gets an access token with the client credentials grant"
      type: "file"
      source: "validation/validate-token-issued.sh"
    - name: "validate-token-role"
      description: "Confirms the token carries inventory-reader and not inventory-admin"
      type: "file"
      source: "validation/validate-token-role.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
