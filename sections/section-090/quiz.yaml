# Knowledge check for section 090. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats090-090
course_id: ATS090
exam_code: KEYCLOAK
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-090
  title: "Keycloak As A SAML Identity Provider"
placement:
  position: after
  reading: sections/section-090/capstone/labs/lab-01/question.md
questions:
  - id: ats090-090-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the roles in SAML"
    source_readings:
      - sections/section-090/module-01/course-01-saml-basics-and-the-keycloak-descriptor.md
    prompt: "In a SAML sign-in with Keycloak, which role does Keycloak play?"
    options:
      - id: a
        text: "Service provider, it receives the assertion."
        explanation: "Not correct. The application is the service provider."
      - id: b
        text: "Identity provider, it authenticates the user and issues the assertion."
        explanation: "Correct. The application relies on it."
      - id: c
        text: "Resource server, it validates access tokens."
        explanation: "Not correct. That is an OAuth term."
      - id: d
        text: "Certificate authority."
        explanation: "Not correct. Keycloak is not a CA here."
    correct_option: b
    explanation: "Correct. The application relies on it."

  - id: ats090-090-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Find the IdP metadata"
    source_readings:
      - sections/section-090/module-01/course-01-saml-basics-and-the-keycloak-descriptor.md
    prompt: "Where does Keycloak publish the SAML metadata of a realm?"
    options:
      - id: a
        text: "`/realms/<realm>/.well-known/openid-configuration`."
        explanation: "Not correct. That is the OpenID Connect document."
      - id: b
        text: "`/realms/<realm>/protocol/saml/descriptor`."
        explanation: "Correct. It lists entity ID, sign-on addresses and certificate."
      - id: c
        text: "`/realms/<realm>/protocol/openid-connect/certs`."
        explanation: "Not correct. That lists JWKS keys."
      - id: d
        text: "`/admin/realms/<realm>/clients`."
        explanation: "Not correct. That is the admin API."
    correct_option: b
    explanation: "Correct. It lists entity ID, sign-on addresses and certificate."

  - id: ats090-090-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Say what the client ID is for SAML"
    source_readings:
      - sections/section-090/module-01/course-02-saml-clients-and-name-ids.md
    prompt: "For a SAML client in Keycloak, what must the client ID equal?"
    options:
      - id: a
        text: "The user name."
        explanation: "Not correct. Users are not clients."
      - id: b
        text: "The entity ID of the service provider."
        explanation: "Correct. The SP puts it in its AuthnRequest."
      - id: c
        text: "The realm name."
        explanation: "Not correct. The realm is separate."
      - id: d
        text: "The ACS address."
        explanation: "Not correct. The ACS address is a redirect URI."
    correct_option: b
    explanation: "Correct. The SP puts it in its AuthnRequest."

  - id: ats090-090-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict a wildcard ACS address"
    source_readings:
      - sections/section-090/module-01/course-02-saml-clients-and-name-ids.md
    prompt: "The valid redirect URIs of a SAML client contain `*`. What is the risk?"
    options:
      - id: a
        text: "The assertion could be sent to an address chosen by an attacker."
        explanation: "Correct. The ACS address is checked against the list."
      - id: b
        text: "The assertion becomes too large."
        explanation: "Not correct. Size does not change."
      - id: c
        text: "Keycloak signs less."
        explanation: "Not correct. Signing is separate."
      - id: d
        text: "The name ID becomes transient."
        explanation: "Not correct. The format is a different setting."
    correct_option: a
    explanation: "Correct. The ACS address is checked against the list."

  - id: ats090-090-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pick the name ID format"
    source_readings:
      - sections/section-090/module-01/course-02-saml-clients-and-name-ids.md
    prompt: "A service provider matches users by email address. Which name ID format fits?"
    options:
      - id: a
        text: "`transient`."
        explanation: "Not correct. It changes on every sign-in."
      - id: b
        text: "`email`."
        explanation: "Correct. The name ID is the user's email address."
      - id: c
        text: "`persistent`."
        explanation: "Not correct. It is opaque, not an email address."
      - id: d
        text: "None, SAML sends no name ID."
        explanation: "Not correct. The assertion has a subject name ID."
    correct_option: b
    explanation: "Correct. The name ID is the user's email address."

  - id: ats090-090-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Say what saml.assertion.signature does"
    source_readings:
      - sections/section-090/module-01/course-03-signatures-and-encryption.md
    prompt: "What does `saml.assertion.signature` set to true do?"
    options:
      - id: a
        text: "Keycloak signs the Assertion element."
        explanation: "Correct. The SP can check who wrote it."
      - id: b
        text: "The SP must sign its requests."
        explanation: "Not correct. That is `saml.client.signature`."
      - id: c
        text: "Keycloak encrypts the assertion."
        explanation: "Not correct. That is `saml.encrypt`."
      - id: d
        text: "The realm key rotates."
        explanation: "Not correct. Rotation is a realm action."
    correct_option: a
    explanation: "Correct. The SP can check who wrote it."

  - id: ats090-090-q07
    type: single_choice
    difficulty: advanced
    learning_objective: "Predict requiring client signatures without a certificate"
    source_readings:
      - sections/section-090/module-01/course-03-signatures-and-encryption.md
    prompt: "`saml.client.signature` is turned on, but no SP certificate is stored in the client. What happens?"
    options:
      - id: a
        text: "Every request fails validation."
        explanation: "Correct. Keycloak has nothing to check signatures against."
      - id: b
        text: "Requests are accepted unsigned."
        explanation: "Not correct. The setting requires signatures."
      - id: c
        text: "The assertion is encrypted."
        explanation: "Not correct. That is a different setting."
      - id: d
        text: "The name ID changes."
        explanation: "Not correct. The format is unaffected."
    correct_option: a
    explanation: "Correct. Keycloak has nothing to check signatures against."

  - id: ats090-090-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pick the mapper for a user property"
    source_readings:
      - sections/section-090/module-01/course-04-attributes-roles-and-single-logout.md
    prompt: "Which mapper type writes the user's email into a SAML attribute?"
    options:
      - id: a
        text: "`saml-role-list-mapper`."
        explanation: "Not correct. It writes roles."
      - id: b
        text: "`saml-user-property-mapper`."
        explanation: "Correct. It copies a user property."
      - id: c
        text: "`oidc-usermodel-property-mapper`."
        explanation: "Not correct. That is an OIDC mapper."
      - id: d
        text: "`saml-hardcode-attribute-mapper`."
        explanation: "Not correct. It writes a fixed value."
    correct_option: b
    explanation: "Correct. It copies a user property."

  - id: ats090-090-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict a misnamed role attribute"
    source_readings:
      - sections/section-090/module-01/course-04-attributes-roles-and-single-logout.md
    prompt: "The SP reads roles from the attribute `Role`, but the role list mapper writes `role-list`. What does the SP see?"
    options:
      - id: a
        text: "The roles, under another name."
        explanation: "Not correct. The SP looks only for its own name."
      - id: b
        text: "No roles, because it finds no attribute named `Role`."
        explanation: "Correct. The attribute name must match."
      - id: c
        text: "An error from Keycloak."
        explanation: "Not correct. Keycloak sends the assertion."
      - id: d
        text: "The roles of every user."
        explanation: "Not correct. Each assertion holds one user's roles."
    correct_option: b
    explanation: "Correct. The attribute name must match."

  - id: ats090-090-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain single logout without a logout address"
    source_readings:
      - sections/section-090/module-01/course-04-attributes-roles-and-single-logout.md
    prompt: "A SAML client has no logout service address. What happens when the user logs out at another SP?"
    options:
      - id: a
        text: "Keycloak tells this SP through a back-channel call."
        explanation: "Not correct. It has no address to call."
      - id: b
        text: "This SP is not told and the user may stay signed in there."
        explanation: "Correct. Keycloak needs an address or the browser."
      - id: c
        text: "Keycloak deletes the client."
        explanation: "Not correct. Nothing like that happens."
      - id: d
        text: "The assertion is encrypted."
        explanation: "Not correct. Encryption is unrelated."
    correct_option: b
    explanation: "Correct. Keycloak needs an address or the browser."
