# Knowledge check for section 110. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats090-110
course_id: ATS090
exam_code: KEYCLOAK
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-110
  title: "Client Registration And Client Policies"
placement:
  position: after
  reading: sections/section-110/capstone/labs/lab-01/question.md
questions:
  - id: ats090-110-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Pick the registration endpoint"
    source_readings:
      - sections/section-110/module-01/course-01-registration-methods-and-initial-access-tokens.md
    prompt: "Which path is the OpenID Connect dynamic registration endpoint of a realm?"
    options:
      - id: a
        text: "`/realms/<realm>/clients-registrations/openid-connect`."
        explanation: "Correct. It follows the standard field names."
      - id: b
        text: "`/realms/<realm>/protocol/openid-connect/token`."
        explanation: "Not correct. That is the token endpoint."
      - id: c
        text: "`/admin/realms/<realm>/clients`."
        explanation: "Not correct. That is the admin API."
      - id: d
        text: "`/realms/<realm>/.well-known/openid-configuration`."
        explanation: "Not correct. That is the discovery document."
    correct_option: a
    explanation: "Correct. It follows the standard field names."

  - id: ats090-110-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Say what an initial access token limits"
    source_readings:
      - sections/section-110/module-01/course-01-registration-methods-and-initial-access-tokens.md
    prompt: "What does an initial access token limit?"
    options:
      - id: a
        text: "The number of registrations and the time it can be used."
        explanation: "Correct. It has a count and an expiration."
      - id: b
        text: "The scopes of the client."
        explanation: "Not correct. Scopes are set by policies."
      - id: c
        text: "The password of the admin."
        explanation: "Not correct. It does not touch passwords."
      - id: d
        text: "The realm key."
        explanation: "Not correct. Keys are separate."
    correct_option: a
    explanation: "Correct. It has a count and an expiration."

  - id: ats090-110-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Say what the registration access token is for"
    source_readings:
      - sections/section-110/module-01/course-01-registration-methods-and-initial-access-tokens.md
      - sections/section-110/module-01/course-04-managing-registered-clients.md
    prompt: "What is the registration access token used for?"
    options:
      - id: a
        text: "To sign users in."
        explanation: "Not correct. It does not sign users in."
      - id: b
        text: "To read, update or delete that one registered client."
        explanation: "Correct. The caller keeps it for its own client."
      - id: c
        text: "To create more clients."
        explanation: "Not correct. That needs an initial access token."
      - id: d
        text: "To renew the admin session."
        explanation: "Not correct. Not its purpose."
    correct_option: b
    explanation: "Correct. The caller keeps it for its own client."

  - id: ats090-110-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict an update"
    source_readings:
      - sections/section-110/module-01/course-04-managing-registered-clients.md
    prompt: "A caller updates its client and keeps the old registration access token. What happens on the next request?"
    options:
      - id: a
        text: "The old token still works."
        explanation: "Not correct. Each update issues a new token."
      - id: b
        text: "The old token is rejected."
        explanation: "Correct. Only the newest token is valid."
      - id: c
        text: "The client is deleted."
        explanation: "Not correct. Nothing is deleted."
      - id: d
        text: "The initial access token is used again."
        explanation: "Not correct. It is not involved."
    correct_option: b
    explanation: "Correct. Only the newest token is valid."

  - id: ats090-110-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the scope of registration policies"
    source_readings:
      - sections/section-110/module-01/course-02-client-registration-policies.md
    prompt: "Where do client registration policies apply?"
    options:
      - id: a
        text: "Only to the registration endpoints."
        explanation: "Correct. Admin console changes are not checked."
      - id: b
        text: "To every client change."
        explanation: "Not correct. That describes client policies."
      - id: c
        text: "Only to confidential clients."
        explanation: "Not correct. They do not depend on client type."
      - id: d
        text: "Only to SAML clients."
        explanation: "Not correct. They are protocol independent."
    correct_option: a
    explanation: "Correct. Admin console changes are not checked."

  - id: ats090-110-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pick the policy for redirect hosts"
    source_readings:
      - sections/section-110/module-01/course-02-client-registration-policies.md
    prompt: "Which registration policy limits the hosts a new client may redirect to?"
    options:
      - id: a
        text: "Max Clients."
        explanation: "Not correct. It limits how many clients exist."
      - id: b
        text: "Trusted Hosts."
        explanation: "Correct. With client URIs must match, redirect URIs must be on a trusted host."
      - id: c
        text: "Consent Required."
        explanation: "Not correct. It forces consent."
      - id: d
        text: "Full Scope Disabled."
        explanation: "Not correct. It turns off full scope."
    correct_option: b
    explanation: "Correct. With client URIs must match, redirect URIs must be on a trusted host."

  - id: ats090-110-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell a profile from a policy"
    source_readings:
      - sections/section-110/module-01/course-03-client-profiles-and-policies.md
    prompt: "In client policies, what is a profile?"
    options:
      - id: a
        text: "A list of conditions."
        explanation: "Not correct. Conditions belong to a policy."
      - id: b
        text: "A named list of executors."
        explanation: "Correct. A policy names the profiles it applies."
      - id: c
        text: "A user group."
        explanation: "Not correct. Not related to users."
      - id: d
        text: "A client scope."
        explanation: "Not correct. Not a scope."
    correct_option: b
    explanation: "Correct. A policy names the profiles it applies."

  - id: ats090-110-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict a profile no policy names"
    source_readings:
      - sections/section-110/module-01/course-03-client-profiles-and-policies.md
    prompt: "A profile exists, but no enabled policy lists it. What does it enforce?"
    options:
      - id: a
        text: "Everything it contains."
        explanation: "Not correct. A profile is applied only through a policy."
      - id: b
        text: "Nothing."
        explanation: "Correct. A policy must name it and be enabled."
      - id: c
        text: "Only the first executor."
        explanation: "Not correct. Not how it works."
      - id: d
        text: "Only on registration."
        explanation: "Not correct. It is not applied at all."
    correct_option: b
    explanation: "Correct. A policy must name it and be enabled."

  - id: ats090-110-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain a policy write"
    source_readings:
      - sections/section-110/module-01/course-03-client-profiles-and-policies.md
    prompt: "What happens when you write `client-policies/policies` with only one policy?"
    options:
      - id: a
        text: "The policy is added to the others."
        explanation: "Not correct. A write replaces the custom set."
      - id: b
        text: "All custom policies are replaced by the one you sent."
        explanation: "Correct. Send the full list."
      - id: c
        text: "The write is rejected."
        explanation: "Not correct. It is accepted."
      - id: d
        text: "Only the name changes."
        explanation: "Not correct. The whole document is replaced."
    correct_option: b
    explanation: "Correct. Send the full list."

  - id: ats090-110-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Pick the executor that rejects the password grant"
    source_readings:
      - sections/section-110/module-01/course-03-client-profiles-and-policies.md
    prompt: "Which executor stops clients from using the password grant?"
    options:
      - id: a
        text: "`pkce-enforcer`."
        explanation: "Not correct. It enforces PKCE."
      - id: b
        text: "`reject-ropc-grant`."
        explanation: "Correct. ROPC is the resource owner password credentials grant."
      - id: c
        text: "`consent-required`."
        explanation: "Not correct. It forces consent."
      - id: d
        text: "`full-scope-disabled`."
        explanation: "Not correct. It limits scope."
    correct_option: b
    explanation: "Correct. ROPC is the resource owner password credentials grant."
