# Final domain quiz. Listed in astrona.yaml as the last `type: quiz` entry. Questions from every section.
schema_version: 1
kind: question_bank
id: ats090-final
course_id: ATS090
exam_code: KEYCLOAK
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: ats090
  title: "Keycloak: Securing Applications & Services"
questions:
  - id: ats090-final-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Tell public and confidential clients apart"
    source_readings:
      - sections/section-010/module-01/course-01-public-and-confidential-clients.md
    prompt: "What decides whether an OAuth 2.0 client is public or confidential?"
    options:
      - id: a
        text: "Whether the client uses the authorization code flow."
        explanation: "Not correct. Both client types can use the authorization code flow."
      - id: b
        text: "Whether the realm has more than one client."
        explanation: "Not correct. The number of clients in a realm does not set the type of one client."
      - id: c
        text: "Whether the client can keep a credential secret."
        explanation: "Correct. A browser or laptop application cannot hide a secret, so it is public. A server can, so it is confidential."
      - id: d
        text: "Whether the client has a valid redirect URI."
        explanation: "Not correct. Public and confidential clients both use redirect URIs."
    correct_option: c
    explanation: "Correct. A browser or laptop application cannot hide a secret, so it is public. A server can, so it is confidential."

  - id: ats090-final-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict Keycloak's answer to an unknown redirect URI"
    source_readings:
      - sections/section-010/module-01/course-02-redirect-uris.md
    prompt: "The client lists only `http://localhost:5173/callback`. A request arrives with `redirect_uri=http://attacker.example/callback`. What does Keycloak do?"
    options:
      - id: a
        text: "It answers with status `400` and an error page, and shows no login form."
        explanation: "Correct. Keycloak refuses before the user types anything."
      - id: b
        text: "It shows the login form and redirects to the attacker after sign-in."
        explanation: "Not correct. Keycloak checks the address before it shows the login form."
      - id: c
        text: "It redirects to `http://localhost:5173/callback` instead."
        explanation: "Not correct. Keycloak does not replace the address."
      - id: d
        text: "It shows the login form but leaves the code out of the redirect."
        explanation: "Not correct. The request is refused at the start."
    correct_option: a
    explanation: "Correct. Keycloak refuses before the user types anything."

  - id: ats090-final-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what CORS protects"
    source_readings:
      - sections/section-010/module-01/course-03-web-origins-and-cors.md
    prompt: "A request from the origin `http://attacker.example` posts a valid code to the token endpoint of a client that allows only `http://localhost:5173`. Sent with `curl`, what does the response show?"
    options:
      - id: a
        text: "Status `401`, because the origin is not allowed."
        explanation: "Not correct. Keycloak does not refuse the request because of its origin."
      - id: b
        text: "Status `403`, because the origin is not in the web origins."
        explanation: "Not correct. Web origins only decide the CORS header."
      - id: c
        text: "Status `200` with `Access-Control-Allow-Origin: *`."
        explanation: "Not correct. Keycloak leaves the header out for an origin that is not allowed."
      - id: d
        text: "Status `200` with tokens, but no `Access-Control-Allow-Origin` header."
        explanation: "Correct. `curl` ignores CORS. A browser would hide the answer from the script."
    correct_option: d
    explanation: "Correct. `curl` ignores CORS. A browser would hide the answer from the script."

  - id: ats090-final-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe what PKCE sends in the authorization request"
    source_readings:
      - sections/section-020/module-01/course-02-pkce.md
    prompt: "With PKCE, what does the application send in the authorization request?"
    options:
      - id: a
        text: "The code verifier itself, with the method `S256`."
        explanation: "Not correct. The verifier travels only in the token request."
      - id: b
        text: "The code challenge, a hash of the code verifier, and the `code_challenge_method`."
        explanation: "Correct. The verifier itself stays in the application until the token request."
      - id: c
        text: "The client secret, as a hash."
        explanation: "Not correct. A public client has no client secret."
      - id: d
        text: "The `nonce`, in place of the challenge."
        explanation: "Not correct. The nonce is a different value with a different job."
    correct_option: b
    explanation: "Correct. The verifier itself stays in the application until the token request."

  - id: ats090-final-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict an exchange without the verifier"
    source_readings:
      - sections/section-020/module-01/course-02-pkce.md
    prompt: "An attacker steals a code that was issued with a PKCE challenge and sends it to the token endpoint without a code verifier. What happens?"
    options:
      - id: a
        text: "Keycloak issues tokens, because a public client has no secret to check."
        explanation: "Not correct. Keycloak checks the verifier against the stored challenge."
      - id: b
        text: "Keycloak asks for the user's password."
        explanation: "Not correct. The token endpoint does not ask for a password in this flow."
      - id: c
        text: "Keycloak issues only an access token."
        explanation: "Not correct. Keycloak issues no token at all."
      - id: d
        text: "Keycloak answers `invalid_grant`, because the PKCE verification fails."
        explanation: "Correct. Without the verifier, the code is worthless."
    correct_option: d
    explanation: "Correct. Without the verifier, the code is worthless."

  - id: ats090-final-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what the state value is for"
    source_readings:
      - sections/section-020/module-01/course-03-state-nonce-and-the-id-token.md
    prompt: "What does the application check with the `state` value?"
    options:
      - id: a
        text: "That the `state` claim of the ID token equals the value it sent."
        explanation: "Not correct. The ID token carries the `nonce`, not the `state`."
      - id: b
        text: "That the `state` is the hash of the code verifier."
        explanation: "Not correct. The two values are not related."
      - id: c
        text: "That the `state` in the redirect equals the value it sent in the authorization request."
        explanation: "Correct. The check shows the redirect answers a sign-in the application started."
      - id: d
        text: "That the `state` is the same for every user."
        explanation: "Not correct. A fixed value protects nothing."
    correct_option: c
    explanation: "Correct. The check shows the redirect answers a sign-in the application started."

  - id: ats090-final-q07
    type: single_choice
    difficulty: beginner
    learning_objective: "Predict the status of an audience failure"
    source_readings:
      - sections/section-030/module-01/course-01-what-an-api-checks.md
    prompt: "A token has a valid signature, the right issuer and is not expired, but its `aud` does not include the API. What does the API answer?"
    options:
      - id: a
        text: "Status `401`, because the token is not acceptable for this API."
        explanation: "Correct. A failed audience check is a `401`."
      - id: b
        text: "Status `403`, because the user lacks a role."
        explanation: "Not correct. `403` is for a missing role, which is checked after the token is accepted."
      - id: c
        text: "Status `200`, because the signature is valid."
        explanation: "Not correct. A valid signature is only the first check."
      - id: d
        text: "Status `404`, because the API cannot find the token."
        explanation: "Not correct. `404` means a missing resource."
    correct_option: a
    explanation: "Correct. A failed audience check is a `401`."

  - id: ats090-final-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Share an audience with a client scope"
    source_readings:
      - sections/section-030/module-01/course-03-audience-and-client-scopes.md
    prompt: "Three clients call the same API. What is the way to give their tokens the API's audience and no other client's?"
    options:
      - id: a
        text: "Put the audience mapper in a realm default scope."
        explanation: "Not correct. Every client's tokens would then carry the audience."
      - id: b
        text: "Put an audience mapper in a client scope and add the scope as a default scope to those three clients."
        explanation: "Correct. A client scope is a reusable set of mappers."
      - id: c
        text: "Turn off the audience check in the API."
        explanation: "Not correct. Every token of the realm would then work on the API."
      - id: d
        text: "Add the audience only to the ID token."
        explanation: "Not correct. The API reads the access token."
    correct_option: b
    explanation: "Correct. A client scope is a reusable set of mappers."

  - id: ats090-final-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Choose introspection for a revoked session"
    source_readings:
      - sections/section-030/module-01/course-04-roles-and-introspection.md
    prompt: "A user's sessions are ended. The API validates tokens locally. What does the API do with the user's existing access token?"
    options:
      - id: a
        text: "It refuses the token at once, because the session ended."
        explanation: "Not correct. The API cannot know about the session without asking Keycloak."
      - id: b
        text: "It still accepts the token until `exp`. Introspection would show `active: false` at once."
        explanation: "Correct. Local validation never asks Keycloak. Only a confidential client can introspect."
      - id: c
        text: "It refuses the token on the next key rotation."
        explanation: "Not correct. Rotation does not depend on sessions."
      - id: d
        text: "It accepts the token only if the client is public."
        explanation: "Not correct. Accepting the token does not depend on the client type."
    correct_option: b
    explanation: "Correct. Local validation never asks Keycloak. Only a confidential client can introspect."

  - id: ats090-final-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain the risk of widening the audience"
    source_readings:
      - sections/section-040/module-01/course-01-forwarding-the-token.md
    prompt: "Why is adding `inventory-api` to the audience of `inventory-cli`'s tokens a poor fix?"
    options:
      - id: a
        text: "Keycloak does not allow more than one audience in a token."
        explanation: "Not correct. A token can list several audiences."
      - id: b
        text: "It breaks the signature of the token."
        explanation: "Not correct. Mappers run before Keycloak signs the token."
      - id: c
        text: "The API then answers `403` instead of `401`."
        explanation: "Not correct. The API would accept the token."
      - id: d
        text: "The client could call the API without the gateway, and one token would work on every service."
        explanation: "Correct. The gateway's checks, limits and logging can be bypassed."
    correct_option: d
    explanation: "Correct. The gateway's checks, limits and logging can be bypassed."

  - id: ats090-final-q11
    type: single_choice
    difficulty: advanced
    learning_objective: "State the second audience rule"
    source_readings:
      - sections/section-040/module-01/course-02-standard-token-exchange.md
    prompt: "The gateway asks for `audience=inventory-admin-api`, but nothing makes that audience available to the gateway. What does Keycloak answer?"
    options:
      - id: a
        text: "An error that says the requested audience is not available."
        explanation: "Correct. The `audience` parameter only filters what is already available."
      - id: b
        text: "A token that contains `inventory-admin-api`, because the gateway asked for it."
        explanation: "Not correct. Keycloak never adds an audience because the request names it."
      - id: c
        text: "A token with an empty `aud`."
        explanation: "Not correct. Keycloak answers with an error."
      - id: d
        text: "A token that the API refuses with `403`."
        explanation: "Not correct. Keycloak does not issue the token."
    correct_option: a
    explanation: "Correct. The `audience` parameter only filters what is already available."

  - id: ats090-final-q12
    type: single_choice
    difficulty: advanced
    learning_objective: "Tell a missing audience from a missing role"
    source_readings:
      - sections/section-040/module-01/course-03-downscoping-and-a-second-api.md
    prompt: "An exchanged token for `alice` reaches `reporting-api`, which requires the role `reporting-reader`. `alice` does not have it. What does the API answer?"
    options:
      - id: a
        text: "`401`, because an exchanged token is never valid."
        explanation: "Not correct. The exchanged token is valid and has the right audience."
      - id: b
        text: "`200`, because the gateway has the role."
        explanation: "Not correct. The token carries the user's roles."
      - id: c
        text: "`403`, because the exchange keeps the user's roles and adds none."
        explanation: "Correct. The audience check passes. The role check fails."
      - id: d
        text: "`200`, because the exchange adds the role."
        explanation: "Not correct. An exchange adds no permissions."
    correct_option: c
    explanation: "Correct. The audience check passes. The role check fails."
  - id: ats090-final-q050a
    type: single_choice
    difficulty: beginner
    learning_objective: "Know what the token response leaves out"
    source_readings:
      - sections/section-050/module-01/course-01-the-client-credentials-grant.md
    prompt: "Which of these does the response to a client credentials request not contain?"
    options:
      - id: a
        text: "A refresh token."
        explanation: "Correct. The response has no refresh token, because the client can ask again with its credentials."
      - id: b
        text: "An access token."
        explanation: "Not correct. The response does contain an access token."
      - id: c
        text: "The lifetime in `expires_in`."
        explanation: "Not correct. The response does contain the lifetime."
      - id: d
        text: "The token type `Bearer`."
        explanation: "Not correct. The response does contain the token type."
    correct_option: a
    explanation: "Correct. The response has no refresh token, because the client can ask again with its credentials."

  - id: ats090-final-q050b
    type: single_choice
    difficulty: intermediate
    learning_objective: "Say where the roles of a service client come from"
    source_readings:
      - sections/section-050/module-01/course-02-service-accounts-and-roles.md
    prompt: "A service client's token has no `inventory-reader` role. Where do you add the role?"
    options:
      - id: a
        text: "On the client, as a client role of the API."
        explanation: "Not correct. The service client holds no role itself in this setup."
      - id: b
        text: "In the token endpoint request, as a `role` field."
        explanation: "Not correct. The request cannot choose roles."
      - id: c
        text: "In the realm settings, as a default token role."
        explanation: "Not correct. A realm setting does not give one client a role."
      - id: d
        text: "As a role mapping on the service account user."
        explanation: "Correct. The role mapping on the service account user reaches the token."
    correct_option: d
    explanation: "Correct. The role mapping on the service account user reaches the token."

  - id: ats090-final-q050c
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict the effect of regenerating a secret"
    source_readings:
      - sections/section-050/module-01/course-04-rotating-secrets-and-calling-apis.md
    prompt: "You regenerate a client secret with no rotation policy. What happens to jobs that use the old secret?"
    options:
      - id: a
        text: "They keep working for 24 hours."
        explanation: "Not correct. Keycloak has no such default grace period."
      - id: b
        text: "They fail on their next token request."
        explanation: "Correct. The old secret stops working at once."
      - id: c
        text: "They get a refresh token instead."
        explanation: "Not correct. The client credentials grant gives no refresh token."
      - id: d
        text: "They switch to the new secret on their own."
        explanation: "Not correct. A job must be given the new secret."
    correct_option: b
    explanation: "Correct. The old secret stops working at once."
  - id: ats090-final-q060a
    type: single_choice
    difficulty: beginner
    learning_objective: "Read the lifetime from a token"
    source_readings:
      - sections/section-060/module-01/course-01-token-and-session-lifespans.md
    prompt: "Which two claims of an access token show how long it lives?"
    options:
      - id: a
        text: "`aud` and `azp`."
        explanation: "Not correct. They name the audience and the client."
      - id: b
        text: "`iss` and `sub`."
        explanation: "Not correct. They name the issuer and the subject."
      - id: c
        text: "`iat` and `exp`."
        explanation: "Correct. The lifetime is `exp` minus `iat`."
      - id: d
        text: "`typ` and `scope`."
        explanation: "Not correct. They give the type and the scopes."
    correct_option: c
    explanation: "Correct. The lifetime is `exp` minus `iat`."

  - id: ats090-final-q060b
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict a reused refresh token"
    source_readings:
      - sections/section-060/module-01/course-02-the-refresh-token-grant-and-rotation.md
    prompt: "Revoke Refresh Token is on and the maximum reuse is 0. A client uses the same refresh token twice. What happens the second time?"
    options:
      - id: a
        text: "Keycloak answers `200` with new tokens."
        explanation: "Not correct. Rotation refuses a used token."
      - id: b
        text: "Keycloak answers `400` with `invalid_grant`."
        explanation: "Correct. Each refresh token works once with rotation on."
      - id: c
        text: "Keycloak logs the user out of all clients."
        explanation: "Not correct. Keycloak only refuses the request."
      - id: d
        text: "Keycloak answers `204`."
        explanation: "Not correct. `204` belongs to the logout endpoint."
    correct_option: b
    explanation: "Correct. Each refresh token works once with rotation on."

  - id: ats090-final-q060c
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know what revocation stops"
    source_readings:
      - sections/section-060/module-01/course-04-ending-sessions-and-revoking-tokens.md
    prompt: "A user logs out and the client revokes the refresh token. An API validates access tokens locally. What does it do with the access token issued before the logout?"
    options:
      - id: a
        text: "It refuses it at once."
        explanation: "Not correct. The API cannot know about the logout without asking Keycloak."
      - id: b
        text: "It accepts it until it expires."
        explanation: "Correct. Local validation checks the signature, issuer, audience and expiry only."
      - id: c
        text: "It accepts it for one more minute."
        explanation: "Not correct. There is no such grace period."
      - id: d
        text: "It converts it to a refresh token."
        explanation: "Not correct. The API does not issue tokens."
    correct_option: b
    explanation: "Correct. Local validation checks the signature, issuer, audience and expiry only."
  - id: ats090-final-q080a
    type: single_choice
    difficulty: beginner
    learning_objective: "Tell default from optional scopes"
    source_readings:
      - sections/section-080/module-01/course-01-client-scopes-default-and-optional.md
    prompt: "When does an optional client scope apply to a token?"
    options:
      - id: a
        text: "For every token request of the client."
        explanation: "Not correct. That describes a default scope."
      - id: b
        text: "Only when the request names it in the `scope` parameter."
        explanation: "Correct. The parameter switches it on for that request."
      - id: c
        text: "Only for users with an admin role."
        explanation: "Not correct. Roles do not decide this."
      - id: d
        text: "Only for the ID token."
        explanation: "Not correct. Scopes affect all tokens that their mappers target."
    correct_option: b
    explanation: "Correct. The parameter switches it on for that request."

  - id: ats090-final-q080b
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the full.path setting"
    source_readings:
      - sections/section-080/module-01/course-02-protocol-mappers-and-custom-claims.md
    prompt: "A group membership mapper has `full.path` set to `true`. What does the claim hold for the group `logistics`?"
    options:
      - id: a
        text: "`logistics`."
        explanation: "Not correct. That is the value with `full.path` false."
      - id: b
        text: "`/logistics`."
        explanation: "Correct. The claim holds the path of the group."
      - id: c
        text: "The ID of the group."
        explanation: "Not correct. The mapper writes names or paths, not IDs."
      - id: d
        text: "Nothing, the claim stays empty."
        explanation: "Not correct. The mapper still writes a value."
    correct_option: b
    explanation: "Correct. The claim holds the path of the group."

  - id: ats090-final-q080c
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose the reader of the ID token"
    source_readings:
      - sections/section-080/module-01/course-04-which-token-carries-what.md
    prompt: "Who is the ID token meant for?"
    options:
      - id: a
        text: "The API that receives requests."
        explanation: "Not correct. That is the access token."
      - id: b
        text: "The client application, to learn who signed in."
        explanation: "Correct. Its audience is the client."
      - id: c
        text: "The Keycloak database."
        explanation: "Not correct. The database does not read tokens."
      - id: d
        text: "The refresh token endpoint."
        explanation: "Not correct. The endpoint reads the refresh token."
    correct_option: b
    explanation: "Correct. Its audience is the client."
  - id: ats090-final-q070a
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict an access token after logout"
    source_readings:
      - sections/section-070/module-01/course-01-how-keycloak-sessions-end.md
    prompt: "An API validates access tokens locally. A user logs out. What does the API do with the access token issued before the logout?"
    options:
      - id: a
        text: "Refuses it at once."
        explanation: "Not correct. The API does not ask Keycloak."
      - id: b
        text: "Accepts it until it expires."
        explanation: "Correct. It checks signature, issuer, audience and expiry only."
      - id: c
        text: "Accepts it for one more minute."
        explanation: "Not correct. There is no grace period."
      - id: d
        text: "Turns it into a refresh token."
        explanation: "Not correct. An API does not issue tokens."
    correct_option: b
    explanation: "Correct. It checks signature, issuer, audience and expiry only."

  - id: ats090-final-q070b
    type: single_choice
    difficulty: intermediate
    learning_objective: "Say what id_token_hint does"
    source_readings:
      - sections/section-070/module-01/course-02-rp-initiated-logout-and-post-logout-redirects.md
    prompt: "What does `id_token_hint` tell Keycloak in a browser logout?"
    options:
      - id: a
        text: "Which redirect address to use."
        explanation: "Not correct. That is `post_logout_redirect_uri`."
      - id: b
        text: "Which session and client the logout is for."
        explanation: "Correct. The ID token identifies them."
      - id: c
        text: "How long the session may live."
        explanation: "Not correct. Limits are realm settings."
      - id: d
        text: "Which user to create."
        explanation: "Not correct. The endpoint does not create users."
    correct_option: b
    explanation: "Correct. The ID token identifies them."

  - id: ats090-final-q070c
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pick the command that ends all sessions of one user"
    source_readings:
      - sections/section-070/module-01/course-04-administering-sessions.md
    prompt: "Which admin call ends all sessions of one user and no others?"
    options:
      - id: a
        text: "`POST logout-all`."
        explanation: "Not correct. That ends every session of the realm."
      - id: b
        text: "`POST users/<id>/logout`."
        explanation: "Correct. It removes that user's sessions."
      - id: c
        text: "`DELETE realms/inventory`."
        explanation: "Not correct. That deletes the realm."
      - id: d
        text: "`PUT clients/<id>`."
        explanation: "Not correct. That changes a client."
    correct_option: b
    explanation: "Correct. It removes that user's sessions."
