# Sender-Constrained Tokens: DPoP And Mutual TLS (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-090-playground-130-01"
  docs:
    guide: "docs/overview.md"
bootstrap:
  init:
    - name: "prepare"
      description: "Deploy Keycloak 26.8.1 and the tester pod, wait for Keycloak, then create the realm inventory with the clients payments-client (DPoP required) and legacy-client (plain bearer tokens)."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "Starting workloads (namespace bound-demo, keycloak-admin Secret, keycloak Deployment and Service, tester client)."
      type: "file"
      source: "manifests/lab-start.yaml"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
