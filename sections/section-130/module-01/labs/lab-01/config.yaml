# Require DPoP Binding
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-090-lab-130-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the tester pod and the lab's workloads, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-090-lab-130-01-setup"
      description: "Creates the realm inventory with payments-client and legacy-client, both issuing plain bearer tokens"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-payments-refused"
      description: "Confirms payments-client is refused without a DPoP proof"
      type: "file"
      source: "validation/validate-payments-refused.sh"
    - name: "validate-legacy-works"
      description: "Confirms legacy-client still gets a token"
      type: "file"
      source: "validation/validate-legacy-works.sh"
    - name: "validate-dpop-attribute"
      description: "Confirms the DPoP attribute is true on payments-client"
      type: "file"
      source: "validation/validate-dpop-attribute.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
