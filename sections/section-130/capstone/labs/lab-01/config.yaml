# Bind Tokens For A Payments Platform
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-090-capstone-130"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the tester pod and the lab's workloads, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-090-capstone-130-setup"
      description: "Creates the realm inventory with a payments client without DPoP and a long token lifetime, and a partner client that wrongly requires DPoP"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-payments-refused"
      description: "Confirms payments-client is refused without a DPoP proof"
      type: "file"
      source: "validation/validate-payments-refused.sh"
    - name: "validate-partner-works"
      description: "Confirms partner-client gets a plain token"
      type: "file"
      source: "validation/validate-partner-works.sh"
    - name: "validate-short-lifetime"
      description: "Confirms access tokens of payments-client live 300 seconds or less"
      type: "file"
      source: "validation/validate-short-lifetime.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
