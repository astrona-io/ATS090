# Make An API Accept The Right Tokens
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-090-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the tester pod and the lab's workloads, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-090-capstone-030-setup"
      description: "Creates the realm inventory where alice's tokens fail inventory-api's checks for three reasons"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-api-accepts-alice"
      description: "Confirms inventory-api answers 200 to alice's access token from inventory-cli"
      type: "file"
      source: "validation/validate-api-accepts-alice.sh"
    - name: "validate-token-claims"
      description: "Confirms alice's token carries the inventory-api audience and the realm role inventory-reader"
      type: "file"
      source: "validation/validate-token-claims.sh"
    - name: "validate-no-admin-roles"
      description: "Confirms alice has the realm role inventory-reader and no administration roles"
      type: "file"
      source: "validation/validate-no-admin-roles.sh"
    - name: "validate-audience-not-everywhere"
      description: "Confirms tokens of inventory-reporter do not carry the inventory-api audience"
      type: "file"
      source: "validation/validate-audience-not-everywhere.sh"
    - name: "validate-api-unchanged"
      description: "Confirms the API code and settings were not changed"
      type: "file"
      source: "validation/validate-api-unchanged.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - node:22-alpine
      - quay.io/keycloak/keycloak:26.8.1
