# Repair The Logout Of A Client
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-090-capstone-070"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the tester pod and the lab's workloads, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-090-capstone-070-setup"
      description: "Creates the realm inventory with a wildcard logout redirect, no back-channel URL, session id off and live sessions"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-post-logout-redirect"
      description: "Confirms the post logout redirect URI is the exact application address"
      type: "file"
      source: "validation/validate-post-logout-redirect.sh"
    - name: "validate-backchannel-url"
      description: "Confirms the back-channel logout URL is set"
      type: "file"
      source: "validation/validate-backchannel-url.sh"
    - name: "validate-backchannel-session-required"
      description: "Confirms the back-channel logout token carries the session id"
      type: "file"
      source: "validation/validate-backchannel-session-required.sh"
    - name: "validate-sessions-ended"
      description: "Confirms alice has no live sessions"
      type: "file"
      source: "validation/validate-sessions-ended.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
