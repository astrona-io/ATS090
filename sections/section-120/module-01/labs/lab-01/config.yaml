# Enable The Device Grant
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-090-lab-120-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the tester pod and the lab's workloads, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-090-lab-120-01-setup"
      description: "Creates the realm inventory with a public client kiosk whose device grant is off"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-device-flow-starts"
      description: "Confirms kiosk gets a device code and a user code"
      type: "file"
      source: "validation/validate-device-flow-starts.sh"
    - name: "validate-polling-pending"
      description: "Confirms polling answers authorization_pending"
      type: "file"
      source: "validation/validate-polling-pending.sh"
    - name: "validate-kiosk-stays-public"
      description: "Confirms kiosk is public and has direct access grants off"
      type: "file"
      source: "validation/validate-kiosk-stays-public.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
