# Give An Application The Claims It Asks For
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-090-lab-020-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the tester pod and the lab's workloads, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-090-lab-020-02-setup"
      description: "Creates the realm inventory with a client whose default scopes no longer include email"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-default-scopes"
      description: "Confirms inventory-app has the default scopes email and profile"
      type: "file"
      source: "validation/validate-default-scopes.sh"
    - name: "validate-userinfo-email"
      description: "Confirms UserInfo returns alice's verified email address"
      type: "file"
      source: "validation/validate-userinfo-email.sh"
    - name: "validate-userinfo-profile"
      description: "Confirms UserInfo still returns the profile claims"
      type: "file"
      source: "validation/validate-userinfo-profile.sh"
    - name: "validate-user-unchanged"
      description: "Confirms the user alice was not changed"
      type: "file"
      source: "validation/validate-user-unchanged.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
