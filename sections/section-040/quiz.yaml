# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats090-040
course_id: ATS090
exam_code: KEYCLOAK
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: "Token Propagation Through An API Gateway"
placement:
  position: after
  reading: sections/section-040/capstone/labs/lab-01/question.md
questions:
  - id: ats090-040-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain why a forwarded token fails"
    source_readings:
      - sections/section-040/module-01/course-01-forwarding-the-token.md
    prompt: "The nginx gateway forwards a token to `inventory-api`, and the API answers `401`. Why?"
    options:
      - id: a
        text: "nginx removes the `Authorization` header."
        explanation: "Not correct. nginx forwards the header unchanged."
      - id: b
        text: "The token's `aud` names the gateway and not the API."
        explanation: "Correct. The API checks the audience and refuses a token meant for another service."
      - id: c
        text: "The signature is no longer valid after one hop."
        explanation: "Not correct. Forwarding does not change the token."
      - id: d
        text: "The token expires when it passes a proxy."
        explanation: "Not correct. The token's `exp` does not depend on the route."
    correct_option: b
    explanation: "Correct. The API checks the audience and refuses a token meant for another service."

  - id: ats090-040-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain the risk of widening the audience"
    source_readings:
      - sections/section-040/module-01/course-01-forwarding-the-token.md
    prompt: "Why is adding `inventory-api` to the audience of `inventory-cli`'s tokens a poor fix?"
    options:
      - id: a
        text: "Keycloak does not allow more than one audience in a token."
        explanation: "Not correct. A token can list several audiences."
      - id: b
        text: "It breaks the signature of the token."
        explanation: "Not correct. Mappers run before Keycloak signs the token."
      - id: c
        text: "The API then answers `403` instead of `401`."
        explanation: "Not correct. The API would accept the token."
      - id: d
        text: "The client could call the API without the gateway, and one token would work on every service."
        explanation: "Correct. The gateway's checks, limits and logging can be bypassed."
    correct_option: d
    explanation: "Correct. The gateway's checks, limits and logging can be bypassed."

  - id: ats090-040-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the token exchange grant"
    source_readings:
      - sections/section-040/module-01/course-02-standard-token-exchange.md
    prompt: "Which `grant_type` does a standard token exchange request use?"
    options:
      - id: a
        text: "`client_credentials`"
        explanation: "Not correct. That grant gets a token for the client itself."
      - id: b
        text: "`authorization_code`"
        explanation: "Not correct. That grant exchanges a code from a browser sign-in."
      - id: c
        text: "`urn:ietf:params:oauth:grant-type:token-exchange`"
        explanation: "Correct. The request also sends a subject token."
      - id: d
        text: "`refresh_token`"
        explanation: "Not correct. That grant renews a token for the same client."
    correct_option: c
    explanation: "Correct. The request also sends a subject token."

  - id: ats090-040-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know who may exchange"
    source_readings:
      - sections/section-040/module-01/course-02-standard-token-exchange.md
    prompt: "Which client can send a standard token exchange request to Keycloak?"
    options:
      - id: a
        text: "A confidential client with standard token exchange switched on."
        explanation: "Correct. It sends its own credentials with the request."
      - id: b
        text: "Any public client that holds a valid token."
        explanation: "Not correct. Only a confidential client may exchange."
      - id: c
        text: "Only a client in the `master` realm."
        explanation: "Not correct. The setting is per client."
      - id: d
        text: "Any client with a valid redirect URI."
        explanation: "Not correct. Redirect URIs have no role in an exchange."
    correct_option: a
    explanation: "Correct. It sends its own credentials with the request."

  - id: ats090-040-q05
    type: single_choice
    difficulty: advanced
    learning_objective: "State the first audience rule"
    source_readings:
      - sections/section-040/module-01/course-02-standard-token-exchange.md
    prompt: "What must be true of the subject token for Keycloak to accept the exchange?"
    options:
      - id: a
        text: "Its `aud` must contain the API named in the `audience` parameter."
        explanation: "Not correct. The new token gets that audience. The subject token does not need it."
      - id: b
        text: "It must be an ID token."
        explanation: "Not correct. The subject token is an access token."
      - id: c
        text: "It must have been issued less than one second ago."
        explanation: "Not correct. Only the normal expiry applies."
      - id: d
        text: "Its `aud` must contain the client that sends the exchange."
        explanation: "Correct. A service can only exchange a token meant for it."
    correct_option: d
    explanation: "Correct. A service can only exchange a token meant for it."

  - id: ats090-040-q06
    type: single_choice
    difficulty: advanced
    learning_objective: "State the second audience rule"
    source_readings:
      - sections/section-040/module-01/course-02-standard-token-exchange.md
    prompt: "The gateway asks for `audience=inventory-admin-api`, but nothing makes that audience available to the gateway. What does Keycloak answer?"
    options:
      - id: a
        text: "A token that contains `inventory-admin-api`, because the gateway asked for it."
        explanation: "Not correct. Keycloak never adds an audience because the request names it."
      - id: b
        text: "An error that says the requested audience is not available."
        explanation: "Correct. The `audience` parameter only filters what is already available."
      - id: c
        text: "A token with an empty `aud`."
        explanation: "Not correct. Keycloak answers with an error."
      - id: d
        text: "A token that the API refuses with `403`."
        explanation: "Not correct. Keycloak does not issue the token."
    correct_option: b
    explanation: "Correct. The `audience` parameter only filters what is already available."

  - id: ats090-040-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the client attribute for token exchange"
    source_readings:
      - sections/section-040/module-01/course-02-standard-token-exchange.md
    prompt: "Which client attribute does the **Standard token exchange** switch set?"
    options:
      - id: a
        text: "`standard.token.exchange.enabled`"
        explanation: "Correct. Set it to `true` on the gateway's client."
      - id: b
        text: "`publicClient`"
        explanation: "Not correct. That attribute sets the client type."
      - id: c
        text: "`directAccessGrantsEnabled`"
        explanation: "Not correct. That attribute allows the password grant."
      - id: d
        text: "`pkce.code.challenge.method`"
        explanation: "Not correct. That attribute requires PKCE."
    correct_option: a
    explanation: "Correct. Set it to `true` on the gateway's client."

  - id: ats090-040-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read an exchanged token"
    source_readings:
      - sections/section-040/module-01/course-02-standard-token-exchange.md
    prompt: "After an exchange for `alice`, which claims does the API see in the new token?"
    options:
      - id: a
        text: "`sub` of the gateway, so the user is lost."
        explanation: "Not correct. The new token keeps the user's identity."
      - id: b
        text: "`azp` of `inventory-cli`, as in the original token."
        explanation: "Not correct. The gateway requested the new token, so `azp` names the gateway."
      - id: c
        text: "`sub` and `preferred_username` of `alice`, `azp` of `inventory-gateway`, and `inventory-api` in `aud`."
        explanation: "Correct. The API knows the user and the caller."
      - id: d
        text: "No roles, because the exchange removes them."
        explanation: "Not correct. The new token still lists the user's roles."
    correct_option: c
    explanation: "Correct. The API knows the user and the caller."

  - id: ats090-040-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain downscoping"
    source_readings:
      - sections/section-040/module-01/course-03-downscoping-and-a-second-api.md
    prompt: "The gateway has audiences for two APIs and exchanges a token without the `audience` parameter. What does the new token's `aud` hold?"
    options:
      - id: a
        text: "Only the first API in alphabetical order."
        explanation: "Not correct. Keycloak does not pick one."
      - id: b
        text: "No audience, until the gateway asks for one."
        explanation: "Not correct. Without the parameter the new token holds all available audiences."
      - id: c
        text: "Every audience that is available to the gateway, so both APIs."
        explanation: "Correct. Each API would receive a token that also works on the other."
      - id: d
        text: "Only the audiences of the subject token."
        explanation: "Not correct. The new token follows what is available to the requester."
    correct_option: c
    explanation: "Correct. Each API would receive a token that also works on the other."

  - id: ats090-040-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Tell a missing audience from a missing role"
    source_readings:
      - sections/section-040/module-01/course-03-downscoping-and-a-second-api.md
    prompt: "An exchanged token for `alice` reaches `reporting-api`, which requires the role `reporting-reader`. `alice` does not have it. What does the API answer?"
    options:
      - id: a
        text: "`403`, because the exchange keeps the user's roles and adds none."
        explanation: "Correct. The audience check passes. The role check fails."
      - id: b
        text: "`401`, because an exchanged token is never valid."
        explanation: "Not correct. The exchanged token is valid and has the right audience."
      - id: c
        text: "`200`, because the gateway has the role."
        explanation: "Not correct. The token carries the user's roles."
      - id: d
        text: "`200`, because the exchange adds the role."
        explanation: "Not correct. An exchange adds no permissions."
    correct_option: a
    explanation: "Correct. The audience check passes. The role check fails."

  - id: ats090-040-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Fix a refused exchange at the right client"
    source_readings:
      - sections/section-040/module-01/course-04-troubleshooting-token-exchange.md
    prompt: "The gateway is allowed to exchange, but Keycloak refuses because the subject token does not name the gateway. Where is the fix?"
    options:
      - id: a
        text: "On the gateway: add an audience mapper for the gateway to it."
        explanation: "Not correct. That changes the gateway's own tokens, not the token that was already sent."
      - id: b
        text: "On the API: add the gateway to its valid redirect URIs."
        explanation: "Not correct. Redirect URIs are not part of the exchange."
      - id: c
        text: "On the user: give `alice` a new role."
        explanation: "Not correct. Roles do not change who a token is meant for."
      - id: d
        text: "On the client that issued the token: add an audience mapper for the gateway to it."
        explanation: "Correct. The first rule is about the token that was sent, so the first client must name the gateway."
    correct_option: d
    explanation: "Correct. The first rule is about the token that was sent, so the first client must name the gateway."

  - id: ats090-040-q12
    type: single_choice
    difficulty: beginner
    learning_objective: "Recognise an authentication failure at the token endpoint"
    source_readings:
      - sections/section-040/module-01/course-04-troubleshooting-token-exchange.md
    prompt: "An exchange with a wrong client secret gets `invalid_client` and status `401`. What does that tell you?"
    options:
      - id: a
        text: "The requester failed to authenticate, before the token is looked at."
        explanation: "Correct. A 401 at the token endpoint is about the client."
      - id: b
        text: "The subject token has expired."
        explanation: "Not correct. That is an error about the token, not about the client."
      - id: c
        text: "The audience is not available to the gateway."
        explanation: "Not correct. That is checked after the client authenticates."
      - id: d
        text: "The user `alice` has the wrong password."
        explanation: "Not correct. No password is sent in an exchange."
    correct_option: a
    explanation: "Correct. A 401 at the token endpoint is about the client."

  - id: ats090-040-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Spot an audience the gateway does not need"
    source_readings:
      - sections/section-040/module-01/course-04-troubleshooting-token-exchange.md
    prompt: "An exchange without an `audience` returns a token whose `aud` lists `inventory-api` and `inventory-admin-api`. The gateway only calls `inventory-api`. What is wrong?"
    options:
      - id: a
        text: "Nothing. An exchange always lists every API in the realm."
        explanation: "Not correct. It lists only what is available to the requester."
      - id: b
        text: "The gateway holds an audience it does not use, so a token without `audience` works on the admin API too."
        explanation: "Correct. Remove the mapper for the admin API from the gateway."
      - id: c
        text: "The first client is confidential."
        explanation: "Not correct. That has no effect on the audiences of the new token."
      - id: d
        text: "The exchange is not allowed for the gateway."
        explanation: "Not correct. The exchange worked, so it is allowed."
    correct_option: b
    explanation: "Correct. Remove the mapper for the admin API from the gateway."
