# Exchange A User Token At The Gateway
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-090-lab-040-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the tester pod and the lab's workloads, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-090-lab-040-01-setup"
      description: "Creates the realm inventory with inventory-gateway that cannot exchange tokens yet"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-exchange-works"
      description: "Confirms inventory-gateway exchanges alice's token for one with audience inventory-api, and inventory-api accepts it"
      type: "file"
      source: "validation/validate-exchange-works.sh"
    - name: "validate-original-token-rejected"
      description: "Confirms inventory-api still rejects alice's original token from inventory-cli"
      type: "file"
      source: "validation/validate-original-token-rejected.sh"
    - name: "validate-api-unchanged"
      description: "Confirms the API code and settings were not changed"
      type: "file"
      source: "validation/validate-api-unchanged.sh"

teardown:
  keepCluster: false
