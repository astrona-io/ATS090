# Repair A Failing Token Exchange
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-090-lab-040-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the tester pod and the lab's workloads, and waits until the administrator can sign in"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-090-lab-040-02-setup"
      description: "Creates the realm inventory with a gateway allowed to exchange, a first client that does not name the gateway, and an extra admin audience on the gateway"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until kcadm.sh can sign in before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-subject-token-audience"
      description: "Confirms the token from inventory-cli names the gateway and no API"
      type: "file"
      source: "validation/validate-subject-token-audience.sh"
    - name: "validate-exchange-for-api"
      description: "Confirms the gateway exchanges alice's token for one meant for inventory-api"
      type: "file"
      source: "validation/validate-exchange-for-api.sh"
    - name: "validate-no-extra-audience"
      description: "Confirms the gateway has the audience inventory-api and no other API"
      type: "file"
      source: "validation/validate-no-extra-audience.sh"
    - name: "validate-admin-audience-refused"
      description: "Confirms the gateway cannot get a token for inventory-admin-api"
      type: "file"
      source: "validation/validate-admin-audience-refused.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
