        title: Section Overview
        path: sections/section-040/README.md

      - type: reading
        title: "Propagate Tokens Through An API Gateway"
        path: sections/section-040/module-01/course.md
      - type: reading
        title: "Forwarding The Token Through A Gateway"
        path: sections/section-040/module-01/course-01-forwarding-the-token.md
      - type: reading
        title: "Standard Token Exchange"
        path: sections/section-040/module-01/course-02-standard-token-exchange.md
      - type: reading
        title: Question
        path: sections/section-040/module-01/labs/lab-01/question.md
      - type: lab
        title: "Exchange A User Token At The Gateway Lab"
        path: sections/section-040/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: token-propagation
        task_kind: build
        tags: [token-exchange, api-gateway, audience, audience-mapper, confidential-client, kcadm]
        learning_goals:
          - Allow standard token exchange for the gateway's confidential client
          - Make the API's audience available to the gateway and to no other client
          - Prove that the exchanged token reaches the API while the user's original token does not
        resources:
          - name: "Securing applications: token exchange"
            url: https://www.keycloak.org/securing-apps/token-exchange
          - name: "RFC 8693: OAuth 2.0 Token Exchange"
            url: https://datatracker.ietf.org/doc/html/rfc8693
      - type: reading
        title: "Downscoping And A Second API"
        path: sections/section-040/module-01/course-03-downscoping-and-a-second-api.md
      - type: reading
        title: Summary
        path: sections/section-040/module-01/course-04-summary.md

      - type: reading
        title: Question
        path: sections/section-040/capstone/labs/lab-01/question.md
      - type: lab
        title: "Propagate A User To A Second API Capstone"
        path: sections/section-040/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 40m
        topic: token-propagation
        task_kind: troubleshooting
        tags: [token-exchange, downscoping, audience, api-gateway, realm-roles, token-forwarding]
        learning_goals:
          - Follow a user's request from the client through the gateway to a second API and find every point where it fails
          - Fix the subject token's audience, the exchange permission, the available audiences and the user's role
          - Prove that the gateway reaches both APIs and nothing else
        resources:
          - name: "Securing applications: token exchange"
            url: https://www.keycloak.org/securing-apps/token-exchange
          - name: "RFC 8693: OAuth 2.0 Token Exchange"
            url: https://datatracker.ietf.org/doc/html/rfc8693
          - name: "Server Administration Guide: audience support"
            url: https://www.keycloak.org/docs/latest/server_admin/index.html#audience-support
